name: Main Workflow

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'pkgs/**'
      - 'pkg-tool/requirements.txt'
      - 'config.yml'
      - '.github/workflows/main.yml'
  push:
    branches:
      - main
    paths:
      - 'pkgs/**'
      - 'pkg-tool/requirements.txt'
      - 'config.yml'
      - '.github/workflows/main.yml'

jobs:
  discover-packages:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pkg-tool
        run: pip install "file://${GITHUB_WORKSPACE}/pkg-tool"

      - name: Parse Packages and Config
        id: set-matrix
        run: |
          if [[ ${{ github.event_name }} == 'pull_request' ]]; then
            changed_pkgs=$(git --no-pager diff --name-only $(git merge-base origin/main HEAD) | grep  pkgs/ | cut -d '/' -f2 | sort -u | tr '\n' ' ' | xargs)
            echo "Changed Packages: ${changed_pkgs}"
            matrix=$(pkg-tool build-matrix ${changed_pkgs})
          else
            matrix=$(pkg-tool build-matrix)
          fi
          echo "Matrix: $matrix"
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  build-packages:
    strategy:
      matrix: ${{ fromJson(needs.discover-packages.outputs.matrix) }}
      fail-fast: false
    runs-on: ubuntu-24.04
    needs: discover-packages
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          path: repo

      - name: Install pkg-tool
        run: pip install "file://${GITHUB_WORKSPACE}/repo/pkg-tool"

      - name: Setup GO
        uses: actions/setup-go@v7
        if: ${{ matrix.go }}
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        if: ${{ matrix.node }}
        with:
          node-version: ${{ matrix.node }}

      - name: Create ${{ matrix.pkg_name }} pkg
        working-directory: ./repo/pkgs/${{ matrix.pkg_name }}/
        run: ./build.sh ${{ matrix.arch }} ${{ matrix.abi }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.run_id }}_${{ matrix.pkg_name }}_${{ matrix.arch }}_${{ matrix.abi }}
          path: dist/*
          retention-days: 1
          compression-level: 1

  deploy-repo:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: build-packages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          path: repo

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Install pkg-tool
        run: pip install "file://${GITHUB_WORKSPACE}/repo/pkg-tool"

      - name: Assemble Repo
        run: |
          mkdir pages
          pkg-tool assemble-repo ./artifacts ./repo/config.yml \
            --owner ${GITHUB_REPOSITORY_OWNER} \
            --repo ${GITHUB_REPOSITORY#*/} \
            --output-dir ./pages

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./pages

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment

  assemble-repo-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    needs: build-packages
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          path: repo

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Install pkg-tool
        run: pip install "file://${GITHUB_WORKSPACE}/repo/pkg-tool"

      - name: Verify repo assembly
        run: |
          if [ -z "$(find artifacts -name '*.pkg' 2>/dev/null | head -n1)" ]; then
            echo "No packages built in this run; skipping assembly check"
            exit 0
          fi
          pkg-tool assemble-repo ./artifacts ./repo/config.yml \
            --owner ${GITHUB_REPOSITORY_OWNER} \
            --repo ${GITHUB_REPOSITORY#*/} \
            --output-dir ./pages-check
          ls ./pages-check/FreeBSD:*/latest/packagesite.tzst

  Check-Build:
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    needs:
      - build-packages
    steps:
      - run: |
          result="${{ needs.build-packages.result }}"
          if [[ $result == "success" || $result == "skipped" ]]; then
            exit 0
          else
            exit 1
          fi

  pkg-tool-tests:
    # pkg-tool is the build toolchain; its changes have no package payload,
    # so they never trigger build-packages — gate them with their own test
    # run instead (pytest suite in pkg-tool/tests/).
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e "./pkg-tool[dev]"
      - run: pytest pkg-tool/tests/ -q
