name: Auto Merge Dependabot
on:
  pull_request:
    types:
      - opened
    branches:
      - "main"

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    name: "Auto Merge Dependabot Github Actions & PIP Updates"
    runs-on: ubuntu-24.04
    if: github.actor == 'dependabot[bot]' && (contains(github.event.pull_request.labels.*.name, 'github_actions') || contains(github.event.pull_request.labels.*.name, 'python'))
    steps:
      - uses: actions/checkout@v7
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Enable Pull Request Automerge
        run: gh pr merge --squash --auto "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Auto approve
        run: gh pr review --approve "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  bump-enhancement-version:
    name: "Bump Enhancement Version in Config"
    runs-on: ubuntu-24.04
    if: github.actor == 'dependabot[bot]' && contains(github.event.pull_request.labels.*.name, 'go')
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Set Git Committer
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install pkg-tool
        run: pip install "file://${GITHUB_WORKSPACE}/pkg-tool"

      - name: Bump enhancement versions
        run: |
          set -euo pipefail

          mapfile -d '' files < <(git diff --name-only -z $(git merge-base origin/${{ github.base_ref }} HEAD))

          pkgs=()
          for f in "${files[@]}"; do
            path="$f"
            [[ $path == pkgs/*/* ]] || continue
            pkgs+=( "${path#pkgs/}" )
          done

          pkgs=( $(printf '%s\n' "${pkgs[@]%%/*}" | sort -u) )

          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "No pkgs found!"
            exit 1
          fi

          for pkg in "${pkgs[@]}"; do
            pkg-tool bump "$pkg" --bump-enhancement
            git add "pkgs/${pkg}/config.yml"
            old=$(git diff --cached "pkgs/${pkg}/config.yml" | sed -n 's/^-.*version:[[:space:]]*//p')
            new=$(git diff --cached "pkgs/${pkg}/config.yml" | sed -n 's/^+.*version:[[:space:]]*//p')
            git commit -m "Updated ${pkg} version from ${old} to ${new}"
          done

          git push

      - name: Enable Pull Request Automerge
        run: gh pr merge --squash --auto "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Auto approve
        run: gh pr review --approve "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
