name: Check for and apply updates

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update.yml'
  schedule:
    - cron: "15 4 * * *"

jobs:
  update:
    outputs:
      matrix: ${{ steps.upgrades.outputs.matrix }}
      pkg_upgraded:  ${{ steps.upgrades.outputs.pkg_upgraded }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pkg-tool/requirements.txt'

      - name: Check Pkgs for updates
        id: upgrades
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pip install "file://${GITHUB_WORKSPACE}/pkg-tool"

          matrix=$(pkg-tool check-updates)
          echo "Matrix: $matrix"

          if [ -z "${matrix}" ]; then
            echo "pkg_upgraded=false" >> $GITHUB_OUTPUT
          else
            echo "pkg_upgraded=true" >> $GITHUB_OUTPUT
            echo "matrix=$matrix" >> $GITHUB_OUTPUT
          fi

  create-prs:
    if: needs.update.outputs.pkg_upgraded == 'true'
    strategy:
      matrix: ${{ fromJson(needs.update.outputs.matrix) }}
      fail-fast: false
    runs-on: ubuntu-26.04
    needs: update
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Install pkg-tool
        run: pip install "file://${GITHUB_WORKSPACE}/pkg-tool"

      - name: Upgrade Pkg
        run: |
          pkg-tool bump ${{ matrix.pkg }} --version ${{ matrix.version }} --abi-arch ${{ matrix.abi_arch }}

      - name: Create Pull Request and Auto Merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="auto-update-${{ matrix.pkg }}"
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade ${{ matrix.pkg }} to ${{ matrix.version }}"
          fi
          git push -u origin "$BRANCH" --force
          PR_URL=$(gh pr create \
            --title "Upgrade ${{ matrix.pkg }} to ${{ matrix.version }}" \
            --body "Upgrading ${{ matrix.pkg }} to newest version: ${{ matrix.version }}" \
            --label "automated pr" \
            --label "update")
          gh pr merge --merge --auto "$PR_URL"
