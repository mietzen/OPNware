---
build_config:
  include: {}
pkg_manifest:
  name: editor
  origin: opnware/editor
  # Version tracks the vendored monaco-editor release (the primary component
  # of the shared editor tree). Bump it whenever pkgs/editor/assets/vendor
  # is refreshed — the build fails on mismatch (see build.sh).
  version: 0.56.0
  comment: Shared vendored Monaco editor assets for the OPNsense WebUI
  www: https://microsoft.github.io/monaco-editor/
  maintainer: github.nstein@mailbox.org
  prefix: /usr/local
  licenselogic: single
  licenses:
    - MIT
  desc: |
    Shared vendored Monaco editor + TextMate stack served from
    /usr/local/opnsense/www/js/vendor. Owned by this package so os-caddy
    and os-homer can both depend on it without pkg file-ownership
    conflicts. Source of truth for the vendored tree:
    pkgs/editor/assets/vendor (the single checked-in copy).

    Not a redistribution and not a source build: the payload is the
    vendored tree bundled in this repo (monaco-editor + vscode-textmate +
    vscode-oniguruma + the hand-rolled bridge), refreshed by hand with
    npm pack. check-updates therefore has no remote source for it; the
    version above tracks the vendored monaco-editor release.
