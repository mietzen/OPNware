---
build_config:
  include: {}
plugin:
  opnsense_version: "26.7"
  tier: 3
  conflicts:
    - os-caddy
pkg_manifest:
  name: caddy
  origin: opnware/os-caddy
  version: 0.1.1
  comment: Caddy web server plugin
  www: https://caddyserver.com/
  maintainer: github.nstein@mailbox.org
  prefix: /usr/local
  licenselogic: single
  licenses:
    - MIT
  desc: |
    OPNware os-caddy: WebUI-managed Caddy web server with process-level
    settings, a user-owned Caddyfile editor and xcaddy-pinned module
    management.

    The plugin code is original work of this repository, licensed MIT
    (see LICENSE in the package). Caddy itself is a separate dependency
    (Apache-2.0, from its own package).
  deps:
    caddy:
      origin: opnware/caddy
      version: ">=2.11.4, <3.0.0"
    editor:
      origin: opnware/editor
      version: ">=0.56.0"
    xcaddy:
      origin: opnware/xcaddy
      version: ">=0.4.5_14"
    go:
      origin: opnware/go
      version: ">=1.25_20,2"
    go126:
      origin: opnware/go126
      version: ">=1.26.5"
