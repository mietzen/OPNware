[modules-rebuild]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/Caddy/modules.php rebuild
parameters:
type:script_output
message:Rebuild Caddy with declared modules
description:Rebuild the caddy binary pinned to the installed version with the declared module set

[modules-ensure]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/Caddy/modules.php ensure
parameters:
type:script_output
message:Ensure Caddy modules are up to date
description:Self-healing check; rebuilds caddy when the build fingerprint or declared module set mismatches

[start-hook]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/Caddy/modules.php ensure
parameters:
type:script_output
message:Ensure Caddy modules are up to date
description:Self-healing module check to run at service start
