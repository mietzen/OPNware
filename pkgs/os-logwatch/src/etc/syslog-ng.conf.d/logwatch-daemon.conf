###################################################################
# Local syslog-ng configuration [logwatch].
###################################################################
# Captures os-logwatch's own daemon log so it appears under
# Diagnostics -> Log Files in OPNsense without looping back into
# s_all ingestion.

source s_logwatch_daemon {
    file(
        "/var/log/logwatch/daemon.log"
        flags(no-parse)
        default-priority(info)
    );
};

destination d_local_logwatch {
    file(
        "/var/log/logwatch/logwatch_${YEAR}${MONTH}${DAY}.log"
        create-dirs(yes)
        flags(syslog-protocol)
    );
};

rewrite r_logwatch_daemon_clean {
    set("logwatch" value("PROGRAM"));
};

log {
    source(s_logwatch_daemon);
    junction {
        channel {
            filter { message("(?i).*error.*|.*exception.*|.*traceback.*"); };
            rewrite { set-severity("3"); };
        };
        channel {
            filter { message("(?i).*warn.*"); };
            rewrite { set-severity("4"); };
        };
        channel {
            filter { not message("(?i).*error.*|.*exception.*|.*traceback.*|.*warn.*"); };
            rewrite { set-severity("6"); };
        };
    };
    rewrite(r_logwatch_daemon_clean);
    destination(d_local_logwatch);
};
