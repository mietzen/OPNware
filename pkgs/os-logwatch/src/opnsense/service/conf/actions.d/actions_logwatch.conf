[start]
command:/usr/sbin/service logwatch start
type:script
message:Starting Logwatch service

[stop]
command:/usr/sbin/service logwatch stop
type:script
message:Stopping Logwatch service

[restart]
command:/usr/sbin/service logwatch restart
type:script
message:Restarting Logwatch service

[reload]
command:/usr/sbin/service logwatch reload
type:script
message:Reloading Logwatch configuration

[status]
command:/usr/sbin/service logwatch onestatus; exit 0
type:script_output
message:Checking Logwatch status

[setup]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/Logwatch/setup.php
type:script_output
message:Configuring Logwatch environment and syslog-ng ingestion

[query]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/Logwatch/manage.py query
parameters:%s
type:script_output
message:Querying Logwatch database

[filters]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/Logwatch/manage.py filters
parameters:%s
type:script_output
message:Fetching Logwatch filter options

[stats]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/Logwatch/manage.py stats
type:script_output
message:Fetching Logwatch dashboard statistics

[rules-validate]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/Logwatch/manage.py rules-validate
type:script_output
message:Validating staged Logwatch YAML rules

[add-ignore]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/Logwatch/manage.py add-ignore
parameters:%s
type:script_output
message:Adding Logwatch ignore rule

[alert-state]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/Logwatch/manage.py alert-state
type:script_output
message:Fetching Logwatch alert cooldown state

[reset-cooldown]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/Logwatch/manage.py reset-cooldown
parameters:%s
type:script_output
message:Resetting Logwatch alert cooldown

[test-smtp]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/Logwatch/manage.py test-smtp
parameters:%s
type:script_output
message:Sending Logwatch test alert email

[clear-logs]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/Logwatch/manage.py clear-logs
type:script_output
message:Clearing Logwatch log database
