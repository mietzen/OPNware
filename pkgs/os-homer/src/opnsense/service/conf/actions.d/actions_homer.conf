[start]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/Homer/service_control.php start
parameters:
type:script
message:Starting Homer service

[stop]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/Homer/service_control.php stop
parameters:
type:script
message:Stopping Homer service

[restart]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/Homer/service_control.php restart
parameters:
type:script
message:Restarting Homer service
description:Restart Homer service

[reload]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/Homer/service_control.php reload
parameters:
type:script
message:Restarting Homer service
description:Restart Homer service

[status]
command:/usr/local/sbin/pluginctl -s homer status
parameters:
type:script_output
message:Request Homer status

[config-save]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/Homer/config_save.php
parameters:
type:script_output
message:Saving Homer config
description:Validate and atomically apply the staged Homer config.yml

[sync-caddy]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/Homer/sync_caddy.php
parameters:
type:script
message:Syncing Homer configuration with Caddy Advanced
description:Synchronize Homer site configuration with Caddy Advanced conf.d

