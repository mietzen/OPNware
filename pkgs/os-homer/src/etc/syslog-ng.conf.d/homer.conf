###################################################################
# Local syslog-ng configuration [homer].
###################################################################
# DO NOT EDIT THIS FILE -- OPNsense auto-generated file
#
# Define Unix socket source for Homer's isolated caddy instance
source s_homer {
    unix-dgram("/var/run/homer/log.sock");
};

# Additionally capture stdout/stderr written by the rc script
source s_homer_stderr {
    file(
        "/var/log/homer/homer.log"
        flags(no-parse)
        default-priority(info)
    );
};

# Parser for Caddy log levels
parser p_homer_levels {
    channel {
        rewrite {
            set-severity("7" condition(message("(?i).*debug.*")));  # DEBUG -> Debug
            set-severity("6" condition(message("(?i).*info.*")));   # INFO -> Informational
            set-severity("4" condition(message("(?i).*warn.*")));   # WARN -> Warning
            set-severity("3" condition(message("(?i).*error.*")));  # ERROR -> Error
            set-severity("2" condition(message("(?i).*panic.*")));  # PANIC -> Critical
            set-severity("1" condition(message("(?i).*fatal.*")));  # FATAL -> Alert
        };
    };
};

# Destination for Homer logs
destination d_local_homer {
    file(
        "/var/log/homer/homer_${YEAR}${MONTH}${DAY}.log"
        create-dirs(yes)
        flags(syslog-protocol)
    );
};

# Rewrite for clean program name and message formatting
rewrite r_homer_clean {
    set("homer" value("PROGRAM"));
    subst("^-\\s+-\\s+\\[[^\\]]+\\]\\s+", "", value("MESSAGE"));
};

# Log path for processing Homer logs
log {
    source(s_homer);
    source(s_homer_stderr);
    parser(p_homer_levels);
    rewrite(r_homer_clean);
    destination(d_local_homer);
};
