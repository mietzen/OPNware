---
build_config:
  include:
    node: '22'
content:
  repo: https://github.com/bastienwirtz/homer
  version: 26.4.2
plugin:
  opnsense_version: "26.7"
  tier: 3
pkg_manifest:
  name: homer
  origin: opnware/os-homer
  version: 0.4.6
  comment: Homer dashboard served via its own isolated caddy instance
  www: https://homer-demo.netlify.app/
  maintainer: github.nstein@mailbox.org
  prefix: /usr/local
  licenselogic: dual
  licenses:
    - MIT
    - APACHE20
  desc: |
    OPNware os-homer: serves the Homer dashboard at /usr/local/www/homer via a dedicated, isolated caddy instance. Settings (port, interface, TLS) regenerate the plugin-owned Caddyfile and restart the instance; logs appear in the core Diagnostics viewer. The plugin code is original work of this repository (MIT, see LICENSE in the package); the bundled Homer dashboard is Apache-2.0 licensed (its LICENSE ships at /usr/local/share/doc/homer/LICENSE, source: https://github.com/bastienwirtz/homer).
  deps:
    caddy:
      origin: opnware/caddy
      version: ">=2.11.4, <3.0.0"
    monaco-editor:
      origin: opnware/monaco-editor
      version: ">=0.56.0_5"
