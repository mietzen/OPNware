---
build_config:
  include: {}
pkg_manifest:
  name: monaco-editor
  origin: opnware/monaco-editor
  # Version tracks the monaco-editor release fetched at build time (the
  # primary component of the shared editor tree). Update policy is manual:
  # bump the version here, build, install on the test VM and visually verify
  # both editors — the nightly update flow no longer proposes monaco bumps.
  version: 0.56.0_4
  comment: Shared Monaco editor assets for the OPNsense WebUI
  www: https://microsoft.github.io/monaco-editor/
  maintainer: github.nstein@mailbox.org
  prefix: /usr/local
  licenselogic: single
  licenses:
    - MIT
  desc: |
    Shared Monaco editor served from
    /usr/local/opnsense/www/js/vendor. Owned by this package so os-caddy-advanced
    and os-homer can both depend on it without pkg file-ownership conflicts.

    Built in CI, not checked in: build.sh npm-packs monaco-editor (at the
    pinned version) and ships the hand-written Caddyfile Monarch grammar from
    src/. The editor pages extend the OPNsense CSP per-controller (worker-src
    blob:, font-src data:), so the fetched monaco tree ships unpatched.
    Bumps are manual and deliberate (base version = the monaco release, a _N
    suffix = package-only changes): bump the version, build, install on the
    test VM and verify both editors.
