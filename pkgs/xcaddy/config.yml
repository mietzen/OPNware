---
build_config:
  include:
    go: '1.25'
  src_repo: 'https://github.com/caddyserver/xcaddy'
pkg_manifest:
  name: xcaddy
  origin: opnware/xcaddy
  version: 0.4.6
  comment: Command line tool to make custom builds of the Caddy Web Server
  www: https://github.com/caddyserver/xcaddy
  maintainer: github.nstein@mailbox.org
  prefix: /usr/local
  licenselogic: single
  licenses:
    - APACHE20
  desc: |
    Pure binary build of the xcaddy CLI, cross-compiled from source for
    FreeBSD. Ships only the /usr/local/bin/xcaddy binary plus license/source
    docs — no rc script, no configuration (the os-caddy-advanced plugin owns
    the module-management workflow).
