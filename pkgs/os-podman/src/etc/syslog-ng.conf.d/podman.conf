###################################################################
# Local syslog-ng configuration [podman].
###################################################################
# DO NOT EDIT THIS FILE -- OPNsense auto-generated file
#
# Additionally capture stdout/stderr written by rc.d/podman_service
source s_podman_stderr {
    file(
        "/var/log/podman/system-service.log"
        flags(no-parse)
        default-priority(info)
    );
};

# Destination for Podman logs
destination d_local_podman {
    file(
        "/var/log/podman/podman_${YEAR}${MONTH}${DAY}.log"
        create-dirs(yes)
        flags(syslog-protocol)
    );
};

# Log path for processing Podman logs
log {
    source(s_podman_stderr);
    rewrite { set("podman" value("PROGRAM")); };
    destination(d_local_podman);
};
