###################################################################
# Local syslog-ng configuration [podman].
###################################################################
# DO NOT EDIT THIS FILE -- OPNsense auto-generated file
#
# Additionally capture stdout/stderr written by rc.d/podman-service
source s_podman_stderr {
    file(
        "/var/log/podman/system-service.log"
        flags(no-parse)
        default-priority(info)
    );
};

# Filter out optional dnsname binary info noise
filter f_podman_clean {
    not message("Failed to get the dnsname plugin version");
};

# Clean redundant HTTP access and ISO timestamp prefixes from log messages
rewrite r_podman_clean {
    set("podman" value("PROGRAM"));
    subst("^-\\s+-\\s+\\[[^\\]]+\\]\\s+", "", value("MESSAGE"));
    subst("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[+\\-0-9:]*\\s+\\[[a-zA-Z]+\\]\\s+", "", value("MESSAGE"));
};

# Destination for Podman logs
destination d_local_podman {
    file(
        "/var/log/podman/podman_${YEAR}${MONTH}${DAY}.log"
        create-dirs(yes)
        flags(syslog-protocol)
    );
};

# Log path for processing Podman logs
log {
    source(s_podman_stderr);
    filter(f_podman_clean);
    rewrite(r_podman_clean);
    destination(d_local_podman);
};
