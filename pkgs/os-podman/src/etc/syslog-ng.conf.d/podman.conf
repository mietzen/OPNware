###################################################################
# Local syslog-ng configuration [podman].
###################################################################
# DO NOT EDIT THIS FILE -- OPNsense auto-generated file
#
# Additionally capture stdout/stderr written by rc.d/podman-service
source s_podman_stderr {
    file(
        "/var/log/podman/system-service.log"
        flags(no-parse)
        default-priority(info)
    );
};

# Filter out optional dnsname binary info noise
filter f_podman_clean {
    not message("Failed to get the dnsname plugin version");
};

# Parser for Podman logrus key-value structured logs
parser p_podman_kv {
    channel {
        filter { message("^time=") or message("level="); };
        parser { kv-parser(prefix(".podman.")); };
        rewrite {
            set-severity("7" condition(match("debug" value(".podman.level"))));
            set-severity("6" condition(match("info" value(".podman.level"))));
            set-severity("4" condition(match("warn" value(".podman.level"))));
            set-severity("3" condition(match("error" value(".podman.level"))));
            set-severity("2" condition(match("panic" value(".podman.level"))));
            set-severity("1" condition(match("fatal" value(".podman.level"))));

            set("${.podman.msg}" value("MESSAGE") condition(match("^." value(".podman.msg"))));
        };
    };
};

# Fallback level detection for non-KV lines
parser p_podman_console_levels {
    channel {
        filter { not match("^." value(".podman.level")); };
        rewrite {
            set-severity("7" condition(message("(?i).*debug.*")));
            set-severity("6" condition(message("(?i).*info.*")));
            set-severity("4" condition(message("(?i).*warn.*")));
            set-severity("3" condition(message("(?i).*error.*")));
            set-severity("2" condition(message("(?i).*panic.*")));
            set-severity("1" condition(message("(?i).*fatal.*")));
        };
    };
};

# Destination for Podman logs
destination d_local_podman {
    file(
        "/var/log/podman/podman_${YEAR}${MONTH}${DAY}.log"
        create-dirs(yes)
        flags(syslog-protocol)
    );
};

# Clean redundant HTTP access, ISO timestamp prefixes, and ANSI escapes
rewrite r_podman_clean {
    set("podman" value("PROGRAM"));
    subst("^-\\s+-\\s+\\[[^\\]]+\\]\\s+", "", value("MESSAGE"));
    subst("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[+\\-0-9:]*\\s+\\[[a-zA-Z]+\\]\\s+", "", value("MESSAGE"));
    subst("\x1b\\[[0-9;]*[a-zA-Z]", "", value("MESSAGE"));
};

# Log path for processing Podman logs
log {
    source(s_podman_stderr);
    filter(f_podman_clean);
    parser(p_podman_kv);
    parser(p_podman_console_levels);
    rewrite(r_podman_clean);
    destination(d_local_podman);
};
