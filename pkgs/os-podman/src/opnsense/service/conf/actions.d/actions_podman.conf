[start]
command:/usr/sbin/service podman_service start
type:script
message:Starting Podman service

[stop]
command:/usr/sbin/service podman_service stop
type:script
message:Stopping Podman service

[restart]
command:/usr/sbin/service podman_service restart
type:script
message:Restarting Podman service

[status]
command:/usr/sbin/service podman_service onestatus; exit 0
type:script_output
message:Checking Podman status

[setup]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/Podman/setup.php
type:script_output
message:Running Podman environment setup

[containers_list]
command:/usr/local/opnsense/scripts/OPNsense/Podman/manage.py containers.list
type:script_output
message:Listing containers

[containers_start]
command:/usr/local/opnsense/scripts/OPNsense/Podman/manage.py containers.start
parameters:%s
type:script_output
message:Starting container %s

[containers_stop]
command:/usr/local/opnsense/scripts/OPNsense/Podman/manage.py containers.stop
parameters:%s
type:script_output
message:Stopping container %s

[containers_kill]
command:/usr/local/opnsense/scripts/OPNsense/Podman/manage.py containers.kill
parameters:%s
type:script_output
message:Killing container %s

[containers_restart]
command:/usr/local/opnsense/scripts/OPNsense/Podman/manage.py containers.restart
parameters:%s
type:script_output
message:Restarting container %s

[containers_delete]
command:/usr/local/opnsense/scripts/OPNsense/Podman/manage.py containers.delete
parameters:%s
type:script_output
message:Deleting container %s

[containers_logs]
command:/usr/local/opnsense/scripts/OPNsense/Podman/manage.py containers.logs
parameters:%s
type:script_output
message:Retrieving logs for container %s

[containers_inspect]
command:/usr/local/opnsense/scripts/OPNsense/Podman/manage.py containers.inspect
parameters:%s
type:script_output
message:Inspecting container %s

[images_list]
command:/usr/local/opnsense/scripts/OPNsense/Podman/manage.py images.list
type:script_output
message:Listing container images

[images_delete]
command:/usr/local/opnsense/scripts/OPNsense/Podman/manage.py images.delete
parameters:%s
type:script_output
message:Deleting container image %s

[volumes_list]
command:/usr/local/opnsense/scripts/OPNsense/Podman/manage.py volumes.list
type:script_output
message:Listing container volumes

[volumes_delete]
command:/usr/local/opnsense/scripts/OPNsense/Podman/manage.py volumes.delete
parameters:%s
type:script_output
message:Deleting container volume %s

[networks_list]
command:/usr/local/opnsense/scripts/OPNsense/Podman/manage.py networks.list
type:script_output
message:Listing container networks

[networks_delete]
command:/usr/local/opnsense/scripts/OPNsense/Podman/manage.py networks.delete
parameters:%s
type:script_output
message:Deleting container network %s

[system_df]
command:/usr/local/opnsense/scripts/OPNsense/Podman/manage.py system.df
type:script_output
message:Querying Podman system disk usage

[system_prune]
command:/usr/local/opnsense/scripts/OPNsense/Podman/manage.py system.prune
type:script_output
message:Running Podman system prune

[system_info]
command:/usr/local/opnsense/scripts/OPNsense/Podman/manage.py system.info
type:script_output
message:Querying Podman system info
