[start]
command:/usr/sbin/service docker-service start
type:script
message:Starting Docker MicroVM and services

[stop]
command:/usr/sbin/service docker-service stop
type:script
message:Stopping Docker MicroVM and services

[restart]
command:/usr/sbin/service docker-service restart
type:script
message:Restarting Docker MicroVM and services

[status]
command:/usr/sbin/service docker-service status
type:script_output
message:Querying Docker MicroVM status

[setup]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/Docker/setup.php
type:script_output
message:Running Docker setup and provisioning

[host_resources]
