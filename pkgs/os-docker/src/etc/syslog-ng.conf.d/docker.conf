###################################################################
# Local syslog-ng configuration [docker].
###################################################################
# DO NOT EDIT THIS FILE -- OPNsense auto-generated file
#
# Capture setup, port sync, and daemon logs
source s_docker_logs {
    file(
        "/var/log/docker/setup.log"
        flags(no-parse)
        default-priority(info)
    );
    file(
        "/var/log/docker/port_sync.log"
        flags(no-parse)
        default-priority(info)
    );
    file(
        "/var/log/docker/terminal.log"
        flags(no-parse)
        default-priority(info)
    );
    file(
        "/var/log/docker/dockerd.log"
        flags(no-parse)
        default-priority(info)
    );
};

destination d_local_docker {
    file(
        "/var/log/docker/docker_${YEAR}${MONTH}${DAY}.log"
        create-dirs(yes)
        dir-perm(0755)
        perm(0644)
        flags(syslog-protocol)
    );
};

rewrite r_docker_clean {
    set("docker" value("PROGRAM"));
    subst("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[+\\-0-9:]*\\s+\\[[a-zA-Z]+\\]\\s+", "", value("MESSAGE"));
    subst("\x1b\\[[0-9;]*[a-zA-Z]", "", value("MESSAGE"));
};

# Log path for processing Docker logs
log {
    source(s_docker_logs);
    junction {
        channel {
            filter { message("^time=") or message("level="); };
            parser { kv-parser(prefix(".docker.")); };
            rewrite {
                set-severity("7" condition(match("debug" value(".docker.level"))));
                set-severity("6" condition(match("info" value(".docker.level"))));
                set-severity("4" condition(match("warn" value(".docker.level"))));
                set-severity("3" condition(match("error" value(".docker.level"))));
                set-severity("2" condition(match("panic" value(".docker.level"))));
                set-severity("1" condition(match("fatal" value(".docker.level"))));

                set("${.docker.msg}" value("MESSAGE") condition(match("^." value(".docker.msg"))));
            };
        };
        channel {
            filter { not (message("^time=") or message("level=")); };
            rewrite {
                set-severity("7" condition(message("(?i).*debug.*")));
                set-severity("6" condition(message("(?i).*info.*")));
                set-severity("4" condition(message("(?i).*warn.*")));
                set-severity("3" condition(message("(?i).*error.*")));
                set-severity("2" condition(message("(?i).*panic.*")));
                set-severity("1" condition(message("(?i).*fatal.*")));
            };
        };
    };
    rewrite(r_docker_clean);
    destination(d_local_docker);
};
