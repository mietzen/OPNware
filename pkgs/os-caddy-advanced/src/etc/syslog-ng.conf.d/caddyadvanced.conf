###################################################################
# Local syslog-ng configuration [caddyadvanced].
###################################################################
# DO NOT EDIT THIS FILE -- OPNsense auto-generated file
#
# Define Unix socket source for Caddy
source s_caddy {
    unix-dgram("/var/run/caddy/log.sock");
};

# Additionally capture stdout/stderr written by the rc script
source s_caddy_stderr {
    file(
        "/var/log/caddy/caddy.log"
        flags(no-parse)
        default-priority(info)
    );
};

# Parser for Caddy structured JSON and log levels
parser p_caddy_parse {
    channel {
        filter { message("^\\{.*\\}$"); };
        parser { json-parser(prefix(".caddy.")); };
        rewrite {
            set-severity("7" condition(match("debug" value(".caddy.level"))));
            set-severity("6" condition(match("info" value(".caddy.level"))));
            set-severity("4" condition(match("warn" value(".caddy.level"))));
            set-severity("3" condition(match("error" value(".caddy.level"))));
            set-severity("2" condition(match("panic" value(".caddy.level"))));
            set-severity("1" condition(match("fatal" value(".caddy.level"))));

            set("${.caddy.msg}" value("MESSAGE") condition(match("^." value(".caddy.msg")) and not match("^." value(".caddy.error"))));
            set("${.caddy.msg} (${.caddy.error})" value("MESSAGE") condition(match("^." value(".caddy.msg")) and match("^." value(".caddy.error"))));
        };
    };
};

# Fallback level detection for non-JSON console lines
parser p_caddy_console_levels {
    channel {
        rewrite {
            set-severity("7" condition(message("(?i).*debug.*")));
            set-severity("6" condition(message("(?i).*info.*")));
            set-severity("4" condition(message("(?i).*warn.*")));
            set-severity("3" condition(message("(?i).*error.*")));
            set-severity("2" condition(message("(?i).*panic.*")));
            set-severity("1" condition(message("(?i).*fatal.*")));
        };
    };
};

# Destination for Caddy logs
destination d_local_caddy {
    file(
        "/var/log/caddyadvanced/caddyadvanced_${YEAR}${MONTH}${DAY}.log"
        create-dirs(yes)
        flags(syslog-protocol)
    );
};

# Rewrite for clean program name, stripping ANSI color escapes and headers
rewrite r_caddy_clean {
    set("caddyadvanced" value("PROGRAM"));
    subst("^-\\s+-\\s+\\[[^\\]]+\\]\\s+", "", value("MESSAGE"));
    subst("\x1b\\[[0-9;]*[a-zA-Z]", "", value("MESSAGE"));
};

# Log path for processing Caddy logs
log {
    source(s_caddy);
    source(s_caddy_stderr);
    parser(p_caddy_parse);
    parser(p_caddy_console_levels);
    rewrite(r_caddy_clean);
    destination(d_local_caddy);
};
