[start]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/CaddyAdvanced/modules.php ensure; service caddy start
parameters:
type:script
message:Starting Caddy service

[stop]
command:service caddy stop
parameters:
type:script
message:Stopping Caddy service

[restart]
command:service caddy restart
parameters:
type:script
message:Restarting Caddy service
description:Restart Caddy service

[reload]
command:service caddy reload
parameters:
type:script
message:Reloading Caddy service
description:Reload Caddy service

[setup]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/CaddyAdvanced/setup.php
parameters:
type:script
message:Sync Caddy environment file
description:Sync the CADDY_LOG_LEVEL env var into the envfile

[dockerproxy-sync]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/CaddyAdvanced/dockerproxy.php
parameters:
type:script
message:Sync Caddy docker-proxy env vars
description:Sync the CADDY_DOCKER_*/DOCKER_* env vars into the envfile

[status]
command:/usr/local/sbin/pluginctl -s caddyadvanced status
parameters:
type:script_output
message:Request Caddy status

[status-details]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/CaddyAdvanced/status.php
parameters:
type:script_output
message:Request Caddy status details

[editor-save]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/CaddyAdvanced/editor_save.php
parameters:
type:script_output
message:Saving Caddy config files
description:Validate, snapshot and atomically apply the staged Caddy file tree, then reload Caddy
